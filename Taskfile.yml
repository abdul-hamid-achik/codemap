version: "3"

vars:
  BINARY_NAME: codemap
  BUILD_DIR: ./bin
  MODULE: github.com/abdul-hamid-achik/codemap
  MAIN: ./cmd/codemap
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.Date={{.BUILD_TIME}}

env:
  CGO_ENABLED: "0"

includes:
  action:
    taskfile: integrations/github-action/Taskfile.yml
    dir: integrations/github-action

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  doctor:
    desc: Check the development environment
    silent: true
    cmds:
      - 'echo "go:           $(go version 2>/dev/null || echo MISSING)"'
      - 'echo "task:         $(task --version 2>/dev/null || echo MISSING)"'
      - 'echo "golangci-lint:$(golangci-lint version 2>/dev/null | head -1 || echo missing)"'
      - 'echo "glyph:        $(glyph --version 2>/dev/null || echo missing)"'
      - 'echo "ollama:       $(ollama --version 2>/dev/null || echo missing)"'
      - 'echo "ollama up:    $(curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 && echo yes || echo no)"'
      - 'echo "nomic model:  $(curl -sf http://localhost:11434/api/tags 2>/dev/null | grep -q nomic-embed-text && echo present || echo missing)"'
      - 'echo "bun:          $(bun --version 2>/dev/null || echo missing)"'
      - 'echo "gopls:        $(command -v gopls >/dev/null 2>&1 && gopls version 2>/dev/null | head -1 || echo missing — run task tools)"'

  setup:
    desc: Install dependencies and dev tools
    cmds:
      - task: deps
      - task: tools

  deps:
    desc: Download and tidy Go modules
    cmds:
      - go mod download
      - go mod tidy

  tools:
    desc: Install dev tools (air for hot reload, gopls for precise glyphrun flows)
    cmds:
      - go install github.com/air-verse/air@latest
      - go install golang.org/x/tools/gopls@latest

  fmt:
    desc: Format Go code
    aliases: [format]
    cmds:
      - gofmt -w .

  verify:source:
    desc: Verify Go formatting and modules without modifying files
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "unformatted Go files:"
          printf '%s\n' "$unformatted"
          exit 1
        fi
      - go mod tidy -diff

  lint:
    desc: Lint with golangci-lint v2.12.2; fall back offline
    cmds:
      - |
        # CI runs this exact version; mirror it locally so lint-only issues
        # (for example unused funcs, which `go vet` misses) are caught early.
        LINT=""
        LINT_VERSION="2.12.2"
        if golangci-lint version 2>/dev/null | grep -qE 'version v?2\.12\.2([[:space:]]|$)'; then
          LINT="golangci-lint"
        elif GOBIN="$PWD/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${LINT_VERSION} 2>/dev/null; then
          LINT="$PWD/bin/golangci-lint"  # cached after first install
        fi
        if [ -n "$LINT" ]; then
          "$LINT" run ./...
        else
          echo "note: golangci-lint v2 unavailable (offline?); running go vet + gofmt"
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "unformatted files:"; gofmt -l .; exit 1)
        fi

  lint:strict:
    desc: Run the exact CI linter and fail if it is unavailable
    cmds:
      - |
        LINT_VERSION="2.12.2"
        if golangci-lint version 2>/dev/null | grep -qE 'version v?2\.12\.2([[:space:]]|$)'; then
          LINT="golangci-lint"
        else
          GOBIN="$PWD/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${LINT_VERSION}
          LINT="$PWD/bin/golangci-lint"
        fi
        "$LINT" run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  race:
    desc: Run tests with the race detector
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  cov:
    desc: Run tests with coverage
    aliases: [coverage]
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  check:
    desc: Format, lint, and test (pre-commit gate)
    aliases: [ci, verify]
    cmds:
      - task: fmt
      - task: lint
      - task: test

  check:verify:
    desc: Run non-mutating source checks, strict lint, and tests
    cmds:
      - task: verify:source
      - task: lint:strict
      - task: test

  build:
    desc: Build the codemap binary to ./bin
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN}}

  release:
    desc: Build an optimized, trimmed binary
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN}}

  install:
    desc: go install codemap to GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" {{.MAIN}}

  run:
    desc: Build and run (pass args via CLI_ARGS="...")
    cmds:
      - task: build
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CLI_ARGS}}"

  dev:
    desc: Hot-reload dev loop (air)
    cmds:
      - air

  flows:
    desc: Run glyphrun E2E behavior specs
    aliases: [e2e]
    deps: [build]
    cmds:
      - glyph run specs/*.yml --format md --progress auto


  bench:
    desc: "Agent benchmark A/B (LOCAL ONLY — needs claude, gopls, ANTHROPIC_API_KEY; not in CI, like flows). Costs API $$ (~$5-15 on sonnet)."
    deps: [build]
    cmds:
      - |
        set -euo pipefail
        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "task bench: no ANTHROPIC_API_KEY — using the logged-in claude CLI (subscription auth;"
          echo "  --bare replaced by --strict-mcp-config, sessions bill your plan; see bench/README.md)"
        fi
        # 1. fetch the pinned fixture by SHA (gitignored)
        bench/fixtures/fetch.sh
        # 2. pre-index the fixture into an ISOLATED codemap data dir (structural
        #    only, --no-embed so no Ollama needed); time it and report separately.
        export CODEMAP_DATA="$PWD/bench/results/index"
        rm -rf "$CODEMAP_DATA"
        idx_start=$(date +%s)
        ./bin/codemap index --precise --no-embed bench/fixtures/repo
        idx_end=$(date +%s)
        idx_secs=$((idx_end - idx_start))
        echo "codemap index (one-time): ${idx_secs}s"
        # 3. run the A/B matrix (model via CODEMAP_BENCH_MODEL, default sonnet)
        go run ./bench --index-seconds "$idx_secs" {{.CLI_ARGS}}
        # 4. regenerate the README table from the newest summary
        go run ./bench --report-only

  bench:report:
    desc: "Regenerate the README benchmark table from the newest results JSON (no re-run, no API)"
    cmds:
      - go run ./bench --report-only

  bench:smoke:
    desc: "Offline benchmark plumbing check (fabricated metrics, no API, no fixture index) — for CI-like sanity"
    cmds:
      - go run ./bench --smoke {{.CLI_ARGS}}

  site:deps:
    desc: Install docs (VitePress) dependencies with Bun
    cmds:
      - bun install --frozen-lockfile

  site:dev:
    desc: Run the VitePress docs dev server
    cmds:
      - bun run site

  site:build:
    desc: Build the VitePress docs site
    cmds:
      - bun run site:build

  ship:
    desc: Run the full pre-release gate with non-mutating source checks
    cmds:
      - task: check:verify
      - task: site:deps
      - task: site:build
      - task: race
      - task: build
      - task: flows

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist coverage.out coverage.html
