name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release and upload archives/checksums

env:
  GO_VERSION: '1.25.12'
  GORELEASER_VERSION: v2.17.0
  TASK_VERSION: v3.51.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Run checks
        run: task check:verify

      - name: Verify clean worktree
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "release checks modified the worktree:"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Codemap Studio: package the desktop app for each OS with the codemap binary
  # built from this same tag inside it, then attach the installers to the
  # release GoReleaser just created. Signing is opt-in through secrets: with a
  # Developer ID (CSC_LINK + CSC_KEY_PASSWORD) and Apple notarization creds
  # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) the macOS build is
  # signed and notarized; without them it is ad-hoc signed (Gatekeeper asks
  # once — right-click → Open). Windows builds are unsigned.
  desktop:
    name: desktop (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: mac
            arch: arm64,x64
            builder: --mac --arm64 --x64
          - runner: ubuntu-latest
            target: linux
            arch: x64
            builder: --linux --x64
          - runner: windows-latest
            target: win
            arch: x64
            builder: --win --x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Version the app from the tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Stage the codemap binary
        run: node scripts/stage-binary.mjs --os "${{ matrix.target }}" --arch "${{ matrix.arch }}" --version "${GITHUB_REF_NAME}"

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=()
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "${{ matrix.target }}" = mac ]; then extra+=(-c.mac.identity=-); fi
          elif [ "${{ matrix.target }}" = mac ] && [ -n "${APPLE_ID}" ]; then
            extra+=(-c.mac.notarize=true)
          fi
          npx --no-install electron-builder ${{ matrix.builder }} --publish never "${extra[@]}"

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.AppImage release/*.tar.gz release/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "electron-builder produced no installers"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
