# Dogfood: run the in-repo codemap GitHub Action (integrations/github-action)
# on codemap's own pull requests, posting the review as a sticky PR comment
# and a job summary.
#
# Deliberately stays on the LOCAL path form (`uses: ./integrations/github-action`)
# rather than the reusable workflow (codemap-review-reusable.yml, this same
# directory) or the published remote ref
# (abdul-hamid-achik/codemap/integrations/github-action@main) that consumers
# use — see integrations/github-action/README.md's "Adoption" section for
# both consumer-facing paths. Either of those would resolve `@main`
# regardless of what a PR here actually changed, so this PR's own in-flight
# action edits would never be exercised by its own dogfood run. The local
# path is what makes this genuinely dogfooding rather than just a consumer
# smoke test.
#
# Informational-only on purpose for the first few weeks (fail-on-untested:
# false, no fail-on-risk) — flip both once the action has proven quiet/
# low-noise on real codemap PRs.
name: codemap review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # required — codemap review --since needs merge-base history

      - uses: ./integrations/github-action
        id: codemap
        with:
          # codemap indexes its own Go source with --precise (default); no
          # language-server inputs needed for a Go-only repo like codemap.
          fail-on-untested: 'false'  # informational only until the action has run quietly for a while
          fail-on-risk: ''  # disabled during the trial period

      - name: Log review outputs
        # Informational only, mirroring the trial period above — once the
        # gates are flipped on, `steps.codemap.outputs.*` is also what a
        # downstream step would read to e.g. label this PR by risk level
        # (see examples/basic-review.yml in integrations/github-action for
        # that pattern spelled out).
        run: |
          echo "risk-level=${{ steps.codemap.outputs.risk-level }}"
          echo "risk-score=${{ steps.codemap.outputs.risk-score }}"
          echo "untested-count=${{ steps.codemap.outputs.untested-count }}"
          echo "changed-symbols-count=${{ steps.codemap.outputs.changed-symbols-count }}"
          echo "analysis-complete=${{ steps.codemap.outputs.analysis-complete }}"
          echo "comment-posted=${{ steps.codemap.outputs.comment-posted }}"
