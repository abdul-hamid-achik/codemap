<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;"
    />
    <title>Codemap Studio</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark">codemap</div>
      <div class="boot-note">starting studio…</div>
    </div>

    <div id="app" class="app" hidden>
      <header id="titlebar" class="titlebar">
        <div class="titlebar-left">
          <span class="brand"><span class="brand-glyph">◈</span> codemap <em>studio</em></span>
        </div>
        <div class="titlebar-center">
          <button id="palette-btn" class="palette-btn" type="button">
            <span class="palette-search">⌕</span>
            <span id="palette-hint">Search features, symbols, files…</span>
            <kbd>⌘K</kbd>
          </button>
        </div>
        <div class="titlebar-right">
          <div id="project-chip" class="project-chip" title="Active project"></div>
          <div id="health-chip" class="health-chip" title="Index health"></div>
          <button id="run-indicator" class="run-indicator" type="button" hidden></button>
          <button id="settings-btn" class="icon-btn" type="button" title="Settings">⚙</button>
        </div>
      </header>

      <div class="body">
        <nav id="sidebar" class="sidebar">
          <div class="sidebar-scroll"></div>
          <div class="sidebar-foot">
            <div id="side-version" class="side-version"></div>
          </div>
        </nav>

        <main id="main" class="main">
          <div id="view-root" class="view-root"></div>
        </main>

        <aside id="inspector" class="inspector" hidden>
          <div class="inspector-head">
            <div id="inspector-title" class="inspector-title">Inspector</div>
            <div class="inspector-actions">
              <button id="inspector-pop" class="icon-btn" type="button" title="Open in a new panel">⤢</button>
              <button id="inspector-close" class="icon-btn" type="button" title="Close (Esc)">✕</button>
            </div>
          </div>
          <div id="inspector-body" class="inspector-body"></div>
        </aside>
      </div>

      <footer id="statusbar" class="statusbar">
        <span id="sb-left" class="sb-left"></span>
        <span id="sb-center" class="sb-center"></span>
        <span id="sb-right" class="sb-right"></span>
      </footer>
    </div>

    <div id="palette" class="palette-overlay" hidden>
      <div class="palette-panel">
        <input id="palette-input" class="palette-input" type="text" placeholder="Jump to a feature, symbol, file, or run a command…" autocomplete="off" spellcheck="false" />
        <div id="palette-list" class="palette-list"></div>
        <div class="palette-foot">
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> run</span><span><kbd>⇧↵</kbd> open only</span><span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <div id="modal-root"></div>

    <script type="module" src="js/app.mjs"></script>
  </body>
</html>
