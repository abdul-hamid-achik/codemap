version: 1
name: help
intent: |
    codemap --help shows its positioning line and lists the core commands, including the
    learning-layer commands (atlas, features, flow) that orient on an unfamiliar repo.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); \"$ROOT/bin/codemap\" --help"
    cwd: "."
terminal:
    cols: 100
    rows: 120
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
    - snapshot: help
outcomes:
    - id: tagline
      description: shows the code-graph positioning line
      verify:
        screen:
            contains: "code graph"
    - id: index_cmd
      description: lists the index command
      verify:
        screen:
            contains: "index"
    - id: serve_cmd
      description: lists the serve command
      verify:
        screen:
            contains: "serve"
    - id: atlas_cmd
      description: lists the atlas command (the described repository tree)
      verify:
        screen:
            contains: "atlas"
    - id: features_cmd
      description: lists the features command (the capability inventory)
      verify:
        screen:
            contains: "features"
    - id: flow_cmd
      description: lists the flow command (a call tree in call order)
      verify:
        screen:
            contains: "flow"
contractHash: sha256:e485f3eb70bf2405fe8f5c24076492fe48925768eaf9e402e2696922c52265af
