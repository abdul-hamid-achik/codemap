version: 1
name: query
intent: |
    after indexing a small project, the call-graph query commands (callers,
    impact, hotspots) return meaningful results, and symbols/find render an
    outline with signatures.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/proj\"; mkdir -p \"$HOME\" \"$P\"; printf '%s' 'package app; func Helper() {}; func Run() { Helper() }; func Top() { Run() }' > \"$P/a.go\"; printf '%s' 'package app; func Other() { Helper(); Run() }' > \"$P/b.go\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; \"$CM\" index --no-embed >/dev/null 2>&1; echo '== callers =='; \"$CM\" callers Helper; echo '== impact =='; \"$CM\" impact Helper; echo '== hotspots =='; \"$CM\" hotspots --top 5; echo '== symbols =='; \"$CM\" symbols a.go; echo '== find =='; \"$CM\" find Run"
    cwd: "."
terminal:
    cols: 100
    rows: 40
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: query
outcomes:
    - id: callers_shown
      description: callers lists who calls Helper
      verify:
        screen:
            contains: "Callers of Helper"
    - id: impact_shown
      description: impact reports the blast radius
      verify:
        screen:
            contains: "blast radius"
    - id: hotspots_shown
      description: hotspots ranks the hubs
      verify:
        screen:
            contains: "Hotspots in"
    - id: signatures_in_outline
      description: symbols/find render signatures, not just bare names
      verify:
        screen:
            contains: "func Run()"
contractHash: sha256:cd00966db5eed3ec413530bf48c70228fb359e90ca599116b2e6bfa1217d8fb2
