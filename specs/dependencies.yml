version: 1
name: dependencies
intent: |
    `codemap dependencies <file>` is the evidence-only file-refactor query for
    people and agents. It groups inbound calls, value references, and imports by
    dependent file, bounds samples while retaining totals, and states which
    dependency domains are complete, partial, or unavailable. Positive evidence
    is actionable; an empty result is never promoted into a safe-delete claim.
    The `codemap_dependencies` MCP tool returns the same report.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/proj\"; mkdir -p \"$HOME\" \"$P\"; printf 'package app\n\nfunc Target() {}\n' > \"$P/target.go\"; printf 'package app\n\nfunc Use() { Target() }\n\nvar Hooks = []func(){Target}\n' > \"$P/wire.go\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; \"$CM\" index --no-embed --no-tips >/dev/null 2>&1; \"$CM\" dependencies target.go; \"$CM\" dependencies target.go --json > \"$TMP/deps.json\"; grep -q '\"evidence_total\": 2' \"$TMP/deps.json\" && grep -q '\"domain\": \"references\"' \"$TMP/deps.json\" && ! grep -q '\"id\":' \"$TMP/deps.json\" && echo JSON_CONTRACT_OK"
    cwd: "."
terminal:
    cols: 110
    rows: 30
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: dependencies
outcomes:
    - id: evidence_grouped
      description: the dependent file carries both call and value-reference evidence
      verify:
        screen:
            contains: "wire.go  calls:1 · references:1"
    - id: explicit_coverage
      description: the human report says dependency coverage is incomplete
      verify:
        screen:
            contains: "coverage:      incomplete"
    - id: stable_json
      description: JSON contains totals and coverage without leaking graph row ids
      verify:
        screen:
            contains: "JSON_CONTRACT_OK"
    - id: clean_exit
      description: dependencies exits cleanly
      verify:
        process:
            exitCode: 0
contractHash: sha256:01f4559c1ca8d18cb31f87aaf58348c66776aad9586cba2d9fbd2c5b2110bd2a
