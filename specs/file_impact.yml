version: 1
name: file_impact
intent: |
    `codemap file-impact <file>` answers "what happens if I change or delete this
    file?" — the file-level peer of impact (a symbol) and review (a diff). It
    aggregates the file's symbols into dependent files, blast radius, covering tests,
    call-graph confidence, and a conservative deletion verdict. Here a.go's Helper is
    called from b.go, which proves deleting a.go is unsafe. c.go's Lonely has no
    indexed callers, but calls alone cannot prove the absence of type/value/import,
    interface, reflection, or dynamic dependencies, so its verdict is unknown rather
    than a destructive false-green. The codemap_file_impact MCP tool returns the same
    report fields.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/proj\"; mkdir -p \"$HOME\" \"$P\"; printf 'package app\\n\\nfunc Helper() {}\\n\\nfunc A() { Helper() }\\n' > \"$P/a.go\"; printf 'package app\\n\\nfunc External() { Helper() }\\n' > \"$P/b.go\"; printf 'package app\\nimport \"testing\"\\nfunc TestHelper(t *testing.T) { Helper() }\\n' > \"$P/a_test.go\"; printf 'package app\\n\\nfunc Lonely() {}\\n' > \"$P/c.go\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; \"$CM\" index --no-embed >/dev/null 2>&1; echo '== a.go =='; \"$CM\" file-impact a.go; echo '== c.go =='; \"$CM\" file-impact c.go"
    cwd: "."
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: file_impact
outcomes:
    - id: file_impact_header
      description: file-impact prints its per-file header
      verify:
        screen:
            contains: "File impact: a.go"
    - id: dependent_file
      description: b.go (which calls into a.go) is reported as a dependent file
      verify:
        screen:
            contains: "b.go"
    - id: unsafe_when_depended_on
      description: a.go has a proven inbound caller and is reported unsafe to delete
      verify:
        screen:
            contains: "delete verdict: unsafe"
    - id: unknown_without_complete_evidence
      description: c.go has no indexed callers but is not falsely reported safe
      verify:
        screen:
            contains: "delete verdict: unknown"
    - id: clean_exit
      description: file-impact exits cleanly
      verify:
        process:
            exitCode: 0
contractHash: sha256:e566789c58773c212c5d1c8a0341e92eea9e17902650b7845eea7acff7422e27
