version: 1
name: ts_impact_note
intent: |
    On a name-based index, TypeScript/JavaScript have only a PARTIAL call graph:
    high-precision candidates for same-file calls and imported bindings; the complete
    graph exists only under --precise via callHierarchy. impact on a TS symbol must find
    the same-file caller, yet still say the graph is partial (absent edges are not proof
    of absence) and point at `index --precise` — never a confidently-complete answer.
    (FIX.md §1.) Needs typescript-language-server (isolates CODEMAP_DATA only, not HOME,
    so the asdf shim resolves).
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/p\"; mkdir -p \"$P/src\"; printf '{\"compilerOptions\":{\"target\":\"ES2020\",\"module\":\"ESNext\",\"strict\":true},\"include\":[\"src\"]}\\n' > \"$P/tsconfig.json\"; printf 'export function getCols(n){ return n*2 }\\nexport function run(){ return getCols(21) }\\n' > \"$P/src/a.ts\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; echo '== index (name-based, no --precise) =='; \"$CM\" index --no-embed 2>&1 | grep -i graph; echo '== impact getCols =='; \"$CM\" impact getCols; echo '== callers getCols =='; \"$CM\" callers getCols"
    cwd: "."
terminal:
    cols: 110
    rows: 24
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 30000
    - snapshot: ts_impact_note
outcomes:
    - id: impact_states_partial
      description: impact on a TS symbol without --precise explains the call graph is partial, not complete
      verify:
        screen:
            contains: "call graph for typescript is partial"
    - id: finds_same_file_caller
      description: the name-based candidate edge surfaces the same-file caller in the blast radius
      verify:
        screen:
            contains: "run                                  src/a.ts:2"
    - id: points_at_precise
      description: the note tells you how to resolve it
      verify:
        screen:
            contains: "index --precise"
    - id: clean_exit
      description: the commands exit cleanly
      verify:
        process:
            exitCode: 0
contractHash: sha256:2a608b8745588c04f5fd1c5696bf7adafc303f2502c360014bb4c12be2b4592f
