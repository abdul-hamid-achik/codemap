version: 1
name: onboarding
intent: |
    A brand-new project (registered by being a directory, but not yet indexed):
    EVERY query command guides you to the one fix — "Project X is not indexed yet.
    Run 'codemap index'." — instead of a confusing empty result that reads like the
    symbol doesn't exist. After indexing, the same query works. This pins the
    cold-start onboarding so find/hotspots/symbols stay consistent with
    status/context/impact/path (all gate on requireIndexed). Pure-Go.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/p\"; mkdir -p \"$HOME\" \"$P\"; printf 'package demo\\nfunc Hello() {}\\n' > \"$P/demo.go\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; echo '== find before index =='; \"$CM\" find Hello; echo '== hotspots before index =='; \"$CM\" hotspots; echo '== now index =='; \"$CM\" index --no-embed | grep graph; echo '== find after index =='; \"$CM\" find Hello"
    cwd: "."
terminal:
    cols: 100
    rows: 24
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: onboarding
outcomes:
    - id: cold_start_guides_to_index
      description: a query before indexing tells you to run 'codemap index' (not a confusing empty result)
      verify:
        screen:
            contains: "Run 'codemap index'"
    - id: works_after_index
      description: after indexing, the same query finds the symbol
      verify:
        screen:
            contains: "func Hello()"
contractHash: sha256:648389c91af7f88531a57219d950fd8e1eb7c789166e9bc4caee9ac815ea9961
