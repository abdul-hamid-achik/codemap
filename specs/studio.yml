version: 1
name: studio
intent: |
    studio opens on the Graph tab showing call-graph hubs, fills the terminal,
    walks into a hub's callers/callees and back, recomputes relations precisely
    via gopls, switches to Metrics (bar charts) and Impact, searches by name,
    then quits cleanly.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/proj\"; mkdir -p \"$HOME\" \"$P\"; printf 'module example.com/app\\n\\ngo 1.25\\n' > \"$P/go.mod\"; printf '%s' 'package app; func Helper() {}; func Run() { Helper(); Helper() }; func Top() { Run() }' > \"$P/a.go\"; printf '%s' 'package app; func Other() { Run(); Helper() }' > \"$P/b.go\"; cd \"$P\"; \"$ROOT/bin/codemap\" index --no-embed >/dev/null 2>&1; \"$ROOT/bin/codemap\" studio"
    cwd: "."
terminal:
    cols: 120
    rows: 40
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "codemap studio"
        timeoutMs: 8000
    - wait:
        screen:
            contains: "Hubs"
        timeoutMs: 8000
    - wait:
        screen:
            contains: "Called by"
        timeoutMs: 8000
    - snapshot: graph
    # Walk the call graph: focus the refs pane (l), re-center on a caller/callee
    # (enter), then return focus to the hub list (h). Uses fast by-name detail.
    - press: "l"
    - press: "enter"
    - wait:
        screen:
            contains: "depth 1"
        timeoutMs: 5000
    - snapshot: graph_walk
    # View the selected node's source in the scrollable overlay, then close it.
    - press: "s"
    - wait:
        screen:
            contains: "esc/q close"
        timeoutMs: 5000
    - snapshot: source
    - press: "q"
    - press: "h"
    - press: "p"
    - wait:
        screen:
            contains: "via gopls"
        timeoutMs: 15000
    - snapshot: graph_precise
    - press: "2"
    - wait:
        screen:
            contains: "By kind"
        timeoutMs: 5000
    - snapshot: metrics
    # The dashboard is navigable: ctrl+s reads the selected row's source.
    - press: "ctrl+s"
    - wait:
        screen:
            contains: "esc/q close"
        timeoutMs: 5000
    - snapshot: metrics_source
    - press: "q"
    - press: "1"
    - wait:
        screen:
            contains: "Hubs"
        timeoutMs: 5000
    - press: "enter"
    - wait:
        screen:
            contains: "Blast radius"
        timeoutMs: 5000
    - snapshot: impact
    - press: "tab"
    - type: "Run"
    - press: "enter"
    - wait:
        screen:
            contains: "name mode"
        timeoutMs: 8000
    - snapshot: search
    # ctrl+s views the selected hit's source from the Search tab (where the text
    # input would otherwise capture a plain `s`), then close it.
    - press: "ctrl+s"
    - wait:
        screen:
            contains: "esc/q close"
        timeoutMs: 5000
    - snapshot: source_search
    - press: "q"
    - press: "ctrl+c"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: studio quits cleanly with status 0
      verify:
        process:
            exitCode: 0
contractHash: sha256:430b9622f34e9ddae11c493172764162f908c17c624c3eb2d253c4805bbb6c04
