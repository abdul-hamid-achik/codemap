version: 1
name: studio
intent: |
    studio opens on the Graph tab showing call-graph hubs, fills the terminal,
    and switches to the Metrics tab with bar charts, then quits cleanly.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/proj\"; mkdir -p \"$HOME\" \"$P\"; printf '%s' 'package app; func Helper() {}; func Run() { Helper(); Helper() }; func Top() { Run() }' > \"$P/a.go\"; printf '%s' 'package app; func Other() { Run(); Helper() }' > \"$P/b.go\"; cd \"$P\"; \"$ROOT/bin/codemap\" index --no-embed >/dev/null 2>&1; \"$ROOT/bin/codemap\" studio"
    cwd: "."
terminal:
    cols: 120
    rows: 40
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "codemap studio"
        timeoutMs: 8000
    - wait:
        screen:
            contains: "Hubs"
        timeoutMs: 8000
    - snapshot: graph
    - press: "2"
    - wait:
        screen:
            contains: "By kind"
        timeoutMs: 5000
    - snapshot: metrics
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: studio quits cleanly with status 0
      verify:
        process:
            exitCode: 0
contractHash: sha256:439e4f75a0d362c76f27131ffad5d91ea75ecf2b7e38d25558867440ffc589d6
