version: 1
name: index_via_daemon
intent: |
    When a background daemon already owns the writable index handle, a plain
    `codemap index` must NOT open a second write session (that would collide
    with the daemon's exclusive veclite lock — the "database file is locked by
    PID ..." error). Instead it delegates the reindex to the daemon over its
    control socket and prints the normal "Indexed ..." summary annotated with
    "via daemon (pid N)". This spec starts a daemon, re-runs `codemap index`,
    and verifies the delegation line appears alongside the index summary.
target:
    cmd:
        - "/bin/sh"
        - "-lc"
        - "ROOT=$(pwd); TMP=$(mktemp -d /tmp/cmdflow.XXXXXX); export HOME=\"$TMP/home\"; export CODEMAP_DATA=\"$TMP/data\"; P=\"$TMP/p\"; mkdir -p \"$HOME\" \"$P\"; printf 'module example.com/m\\n\\ngo 1.25\\n' > \"$P/go.mod\"; printf 'package m\\nfunc AlphaSym() {}\\n' > \"$P/a.go\"; cd \"$P\"; CM=\"$ROOT/bin/codemap\"; \"$CM\" index --no-embed >/dev/null 2>&1; \"$CM\" daemon start --no-embed >\"$TMP/daemon.log\" 2>&1 & for i in $(seq 1 60); do \"$CM\" daemon status >/dev/null 2>&1 && break; sleep 0.25; done; echo '== index while daemon runs =='; \"$CM\" index --no-embed --no-tips 2>&1; echo '== stop =='; \"$CM\" daemon stop; for i in $(seq 1 60); do \"$CM\" daemon status >/dev/null 2>&1 || break; sleep 0.25; done"
    cwd: "."
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 30000
    - snapshot: delegated
outcomes:
    - id: index_summary
      description: the delegated index prints the normal Indexed summary
      verify:
        screen:
            contains: "Indexed"
    - id: via_daemon
      description: the summary is annotated as delegated to the running daemon
      verify:
        screen:
            contains: "via daemon (pid"
    - id: no_lock_error
      description: no veclite lock error is raised
      verify:
        screen:
            notContains: "database file is locked"
    - id: clean_stop
      description: daemon stop shuts it down
      verify:
        screen:
            contains: "codemap daemon: stopping"