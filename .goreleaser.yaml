version: 2

project_name: codemap

before:
  hooks:
    - go mod tidy

builds:
  - id: codemap
    main: ./cmd/codemap
    binary: codemap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/abdul-hamid-achik/codemap/internal/version.Version={{.Version}}
      - -X github.com/abdul-hamid-achik/codemap/internal/version.Commit={{.ShortCommit}}
      - -X github.com/abdul-hamid-achik/codemap/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

homebrew_casks:
  - name: codemap
    binaries:
      - codemap
    repository:
      owner: abdul-hamid-achik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/abdul-hamid-achik/codemap"
    description: "Local-first code intelligence: a code graph + semantic search for agents and people"
    # Semantic search is optional and needs a local Ollama; cask dependencies
    # can't express "optional", so it's a caveat rather than a hard dependency.
    # Keep this a SINGLE line: GoReleaser renders each line as a separate Ruby
    # string literal in the `caveats do … end` block, and the block returns only
    # its last expression — so a multi-line caveat would drop all but the last line.
    caveats: "codemap works offline for structural queries; semantic search is optional and needs a local Ollama (https://ollama.com): run `ollama pull nomic-embed-text`."
    # The released binaries are unsigned (pure-Go, CGO_ENABLED=0, not notarized),
    # so strip the Gatekeeper quarantine attribute on install — otherwise macOS
    # refuses to run a cask-installed unsigned binary ("damaged and can't be opened").
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/codemap"]
          end
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"

release:
  github:
    owner: abdul-hamid-achik
    name: codemap
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
